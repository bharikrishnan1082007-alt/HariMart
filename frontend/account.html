<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | HariMart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .account-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2.5rem;
            margin: 2rem 0 4rem;
        }

        .account-sidebar {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            height: fit-content;
            box-shadow: var(--shadow-sm);
        }

        .account-user-card {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .user-avatar-circle {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .account-nav-list {
            list-style: none;
        }

        .account-tab-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .account-tab-btn:hover {
            background: #F1F5F9;
            color: var(--secondary);
        }

        .account-tab-btn.active {
            background: var(--primary);
            color: #FFFFFF;
        }

        .account-tab-pane {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        @media (max-width: 900px) {
            .account-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Main Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-top">
                <a href="index.html" class="brand-logo">
                    <div class="logo-badge">H</div>
                    <div class="brand-name">Hari<span>Mart</span></div>
                </a>

                <div class="header-actions">
                    <div id="header-auth-container"></div>
                    <a href="cart.html" class="header-action-item" title="Cart">
                        <span style="font-size: 1.35rem;">🛒</span>
                        <span class="badge-counter cart-count-badge" style="display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="account-layout">
            <!-- Left Account Navigation -->
            <aside class="account-sidebar">
                <div class="account-user-card">
                    <div class="user-avatar-circle">👤</div>
                    <div>
                        <strong id="profile-name-display" style="font-size: 1rem; color: var(--secondary); display: block;">Loading...</strong>
                        <span id="profile-email-display" style="font-size: 0.75rem; color: var(--text-muted);">customer@harimart.com</span>
                    </div>
                </div>

                <ul class="account-nav-list">
                    <li><button type="button" class="account-tab-btn active" data-tab="profile"><span>👤</span> Personal Profile</button></li>
                    <li><button type="button" class="account-tab-btn" data-tab="orders"><span>📦</span> My Orders</button></li>
                    <li><button type="button" class="account-tab-btn" data-tab="addresses"><span>📍</span> Saved Addresses</button></li>
                    <li><button type="button" class="account-tab-btn" data-tab="wishlist"><span>❤️</span> My Wishlist</button></li>
                    <li style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.5rem;">
                        <button type="button" class="account-tab-btn" style="color: var(--accent-crimson);" onclick="window.Auth.logout()"><span>🚪</span> Sign Out</button>
                    </li>
                </ul>
            </aside>

            <!-- Right Tab Contents -->
            <section class="account-main">
                <!-- Tab 1: Profile -->
                <div class="account-tab-pane" id="tab-pane-profile" style="display: block;">
                    <div style="background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2rem; box-shadow: var(--shadow-sm);">
                        <h2 style="font-size: 1.3rem; color: var(--secondary); margin-bottom: 1.25rem;">Personal Profile</h2>
                        
                        <form id="profile-edit-form" style="max-width: 500px;">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="profile-name-input" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address (Registered)</label>
                                <input type="email" id="profile-email-input" class="form-input" disabled style="background:#F1F5F9; cursor:not-allowed;">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Mobile Number</label>
                                <input type="tel" id="profile-phone-input" class="form-input" required maxlength="10">
                            </div>

                            <button type="submit" class="form-btn-primary" style="width: auto; padding: 0.75rem 2rem;">Save Changes</button>
                        </form>
                    </div>
                </div>

                <!-- Tab 2: Orders -->
                <div class="account-tab-pane" id="tab-pane-orders">
                    <h2 style="font-size: 1.3rem; color: var(--secondary); margin-bottom: 1.25rem;">Order History</h2>
                    <div id="account-orders-list">
                        <!-- Populated via account.js -->
                    </div>
                </div>

                <!-- Tab 3: Saved Addresses -->
                <div class="account-tab-pane" id="tab-pane-addresses">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                        <h2 style="font-size: 1.3rem; color: var(--secondary);">Delivery Addresses</h2>
                        <button type="button" class="form-btn-primary" id="add-address-btn" style="width: auto; padding: 0.5rem 1.25rem; font-size: 0.85rem;">+ Add Address</button>
                    </div>
                    <div id="account-addresses-list">
                        <!-- Populated via account.js -->
                    </div>
                </div>

                <!-- Tab 4: Wishlist -->
                <div class="account-tab-pane" id="tab-pane-wishlist">
                    <h2 style="font-size: 1.3rem; color: var(--secondary); margin-bottom: 1.25rem;">Saved Items in Wishlist</h2>
                    <div class="products-grid" id="account-wishlist-grid">
                        <!-- Populated via account.js -->
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Add Address Modal -->
    <div class="modal-overlay" id="address-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Add New Address</h3>
                <button type="button" class="modal-close-btn" onclick="window.UI.closeModal('address-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="new-address-modal-form">
                    <div class="form-group">
                        <label class="form-label">Address (House, Street, Area) *</label>
                        <input type="text" id="modal-addr-line" class="form-input" required placeholder="e.g. Flat 101, Sunflower Apartments">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">City *</label>
                            <input type="text" id="modal-addr-city" class="form-input" required placeholder="e.g. Bengaluru">
                        </div>
                        <div class="form-group">
                            <label class="form-label">State *</label>
                            <input type="text" id="modal-addr-state" class="form-input" required placeholder="e.g. Karnataka">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">PIN Code *</label>
                        <input type="text" id="modal-addr-pincode" class="form-input" required placeholder="e.g. 560001" maxlength="6">
                    </div>
                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; cursor:pointer;">
                            <input type="checkbox" id="modal-addr-default">
                            <span>Set as default shipping address</span>
                        </label>
                    </div>
                    <button type="submit" class="form-btn-primary">Save Address</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                &copy; 2026 HariMart E-Commerce Platform. All rights reserved. Made with ❤️ in Bharat.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
