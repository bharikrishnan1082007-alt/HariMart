# HariMart Application Configuration
app.name=HariMart
app.tagline=Discover More. Shop Smarter.
app.currency.symbol=\u20B9
app.currency.code=INR

# Database Settings
db.driver=org.h2.Driver
# File-backed H2 persistent database (relative to working directory or user home)
db.url=jdbc:h2:file:./data/harimart_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=LEGACY
db.username=sa
db.password=
db.pool.maxSize=15
db.pool.minIdle=5

# E-Commerce Business Rules
promo.code=HARI10
promo.discount.percent=10.0
shipping.free.threshold=499.00
shipping.standard.fee=49.00
tax.rate.percent=5.0
platform.commission.rate=10.0
